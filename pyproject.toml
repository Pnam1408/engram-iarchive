[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-simulation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "reedsolo",
    "circomlibpy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
engram-benchmark = "engram.experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]