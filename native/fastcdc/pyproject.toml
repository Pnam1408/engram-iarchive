[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "engram-fastcdc-native"
version = "0.1.0"
requires-python = ">=3.10"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "../../src"
module-name = "engram.processing.chunking._fastcdc"
features = ["pyo3/extension-module"]
